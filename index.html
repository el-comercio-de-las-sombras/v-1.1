<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOP SECRET – El Comercio de las Sombras</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#050505;
}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.cover-wrap{
  position:relative;
  width:100vw;
  height:100vh;
  background:#050505;
}
.cover-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}

/*
  Transparent click area over the "AKTE ÖFFNEN" button
  already visible inside the image.
  Coordinates are percentage-based so the hotspot scales
  together with the image.
*/
.open-hotspot{
  position:absolute;
  left:37.5%;
  top:73.2%;
  width:25%;
  height:9%;
  z-index:5;
  cursor:pointer;
  border-radius:4px;
  text-indent:-9999px;
  overflow:hidden;
}
.open-hotspot:focus-visible{
  outline:2px solid #b79a5a;
  outline-offset:3px;
}

/* On very tall/mobile screens keep the complete dossier visible */
@media (max-aspect-ratio: 16/9){
  .cover-wrap{
    width:100vw;
    height:auto;
    aspect-ratio:16/9;
  }
  body{
    align-content:center;
  }
}
</style>
</head>
<body>
<main class="cover-wrap">
  <img
    class="cover-img"
    src="assets/images/akte-cover-16x9.png"
    alt="TOP SECRET – El Comercio de las Sombras"
  >
  <a class="open-hotspot" href="akte.html" aria-label="Akte öffnen">Akte öffnen</a>
</main>
</body>
</html>
