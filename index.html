<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOP SECRET – El Comercio de las Sombras</title>
<style>
:root {
  --gold:#c6a15b;
  --gold-light:#e4c77f;
}
* { box-sizing:border-box; }
html, body {
  margin:0;
  width:100%;
  height:100%;
  background:#050403;
}
body {
  overflow:hidden;
  font-family:Georgia, "Times New Roman", serif;
}
.cover {
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#050403;
}
.cover-image {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}
.cover::after {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(to bottom, rgba(0,0,0,0) 58%, rgba(0,0,0,.28) 100%),
    radial-gradient(circle at center, transparent 60%, rgba(0,0,0,.16) 100%);
}
.open-button {
  position:absolute;
  z-index:3;
  left:50%;
  bottom:4.5vh;
  transform:translateX(-50%);
  min-width:310px;
  padding:17px 36px;
  border:1px solid var(--gold);
  background:rgba(5,4,3,.88);
  color:var(--gold-light);
  text-decoration:none;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:.15em;
  font-size:20px;
  box-shadow:0 14px 40px rgba(0,0,0,.65);
  backdrop-filter:blur(5px);
  transition:all .22s ease;
}
.open-button:hover {
  background:var(--gold);
  color:#090705;
  transform:translateX(-50%) translateY(-3px);
  box-shadow:0 18px 48px rgba(0,0,0,.8);
}
.open-button:focus-visible {
  outline:2px solid #fff0c2;
  outline-offset:4px;
}
@media (max-width:700px) {
  .open-button {
    min-width:220px;
    padding:14px 22px;
    font-size:15px;
    bottom:3.5vh;
  }
}
</style>
</head>
<body>
<main class="cover">
  <img class="cover-image"
       src="assets/images/akte-cover-2560x1440.png"
       alt="TOP SECRET – El Comercio de las Sombras">
  <a class="open-button" href="akte.html">Akte öffnen</a>
</main>
</body>
</html>
