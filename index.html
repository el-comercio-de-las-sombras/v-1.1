<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOP SECRET – El Comercio de las Sombras</title>
<style>
:root{
  --gold:#c5a461;
  --gold2:#e0c17b;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#050505;
}
body{
  min-height:100vh;
  overflow:hidden;
  font-family:Georgia,"Times New Roman",serif;
}
.cover{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#050505;
}
.cover img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}
.cover::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.04) 55%,rgba(0,0,0,.32) 100%),
    radial-gradient(circle at center,transparent 55%,rgba(0,0,0,.24) 100%);
}
.open-button{
  position:absolute;
  z-index:3;
  left:50%;
  bottom:6.5vh;
  transform:translateX(-50%);
  min-width:290px;
  padding:17px 34px;
  border:1px solid var(--gold);
  background:rgba(7,7,7,.86);
  color:var(--gold2);
  text-decoration:none;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:.13em;
  font-size:20px;
  line-height:1;
  box-shadow:0 12px 38px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.03);
  backdrop-filter:blur(5px);
  transition:.22s ease;
}
.open-button:hover{
  background:var(--gold);
  color:#080706;
  transform:translateX(-50%) translateY(-3px);
  box-shadow:0 16px 45px rgba(0,0,0,.75);
}
.open-button:focus-visible{
  outline:2px solid #fff1c9;
  outline-offset:4px;
}
@media(max-width:700px){
  .cover img{object-position:center}
  .open-button{
    min-width:220px;
    padding:15px 22px;
    font-size:16px;
    bottom:5vh;
  }
}
</style>
</head>
<body>
<main class="cover">
  <img src="assets/images/akte-cover.png" alt="TOP SECRET – El Comercio de las Sombras">
  <a class="open-button" href="akte.html">Akte öffnen</a>
</main>
</body>
</html>
